name: Update Lyme reference data

on:
  schedule:
    - cron: "30 23 * * 3"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-lyme-reference-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.8.14"
          python-version: "3.14.8"
          enable-cache: true

      - name: Install locked project dependencies
        run: uv sync --locked

      - name: Fetch IDD data and update reference only if changed
        run: uv run python src/update_idd_reference.py

      - name: Commit changed snapshot and provenance
        shell: bash
        run: |
          if git diff --quiet -- data/reference/lyme_sentinella/data.csv data/reference/lyme_sentinella/metadata.json; then
            echo "IDD data unchanged; no commit needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reference/lyme_sentinella/data.csv data/reference/lyme_sentinella/metadata.json
          git commit -m "Update Lyme reference data from IDD"
          git push
