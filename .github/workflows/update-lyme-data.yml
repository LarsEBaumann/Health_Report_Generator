name: Update IDD reference data and build report artifact

on:
  schedule:
    - cron: "30 23 * * 3"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-idd-reference-data
  cancel-in-progress: false

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.6"
          cache: pip
          cache-dependency-path: scripts/health_pipeline/requirements.lock.txt
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3.2"
          use-public-rspm: true
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.3.353"
          tinytex: true
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Restore R packages
        run: Rscript workflow/restore_r.R
      - name: Install locked Python dependencies
        run: python -m pip install -r scripts/health_pipeline/requirements.lock.txt
      - name: Test workflow code
        run: python -m pytest -q
      - name: Pull the latest IDD CSV and metadata exports
        run: python src/sync_idd_exports.py
      - name: Commit changed source snapshots
        shell: bash
        run: |
          git add -- data/reference
          if git diff --cached --quiet -- data/reference; then
            echo "IDD exports unchanged; no data commit needed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update IDD reference data"
            git push
          fi
      - name: Build validated reports and lineage bundle
        run: |
          set -o pipefail
          snakemake --cores 2 || {
            status=$?
            if [ -f results/checks.csv ]; then
              echo '--- Validation failures ---'
              python - <<'PY'
          import pandas as pd
          checks = pd.read_csv('results/checks.csv')
          failed = checks[checks['status'].eq('FAIL')]
          print(failed.to_string(index=False) if not failed.empty else 'No FAIL rows found in results/checks.csv')
          PY
            fi
            exit "$status"
          }
      - name: Check Shiny bundle
        run: Rscript tests/shiny_smoke.R results/reports/public_health_expert/app
      - name: Upload successful versioned report bundle
        uses: actions/upload-artifact@v4
        with:
          name: health-report-${{ github.run_id }}
          path: results/
          retention-days: 30
