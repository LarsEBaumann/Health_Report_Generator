name: Build and test request environment
run-name: Request environment test — ${{ github.sha }}
on:
  push:
    branches: [test]
    paths:
      - 'Dockerfile.request'
      - 'Dockerfile.request.dockerignore'
      - '.github/workflows/request-image.yml'
      - 'workflow/install_request_tex.sh'
      - 'workflow/test_request_image.py'
      - 'workflow/restore_r.R'
      - 'scripts/health_pipeline/requirements.lock.txt'
      - 'renv.lock'
      - '.Rprofile'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: request-environment-test-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-test-publish:
    if: github.ref == 'refs/heads/test'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Choose separate test image name
        id: image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-request-test"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$image:sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build environment without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.request
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=request-environment-test
          cache-to: type=gha,mode=max,scope=request-environment-test
      - name: Test environment and reports without network access
        env:
          REQUEST_IMAGE: ${{ steps.image.outputs.tag }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/request-image-evidence"
          docker image inspect "$REQUEST_IMAGE" > "$RUNNER_TEMP/request-image-evidence/image-inspect.json"
          docker run --rm --network none \
            --user "$(id -u):$(id -g)" \
            --env XDG_CACHE_HOME=/tmp/request-cache \
            --env XDG_CONFIG_HOME=/tmp/request-config \
            --env MPLCONFIGDIR=/tmp/request-matplotlib \
            --env TEXMFVAR=/tmp/request-tex-var \
            --env TEXMFCONFIG=/tmp/request-tex-config \
            --env REQUEST_IMAGE \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace" \
            --workdir /workspace "$REQUEST_IMAGE" \
            python workflow/test_request_image.py
      - name: Save successful container test evidence
        uses: actions/upload-artifact@v4
        with:
          name: request-image-test-${{ github.run_id }}
          path: |
            results/request-image-smoke/
            ${{ runner.temp }}/request-image-evidence/
          if-no-files-found: error
          retention-days: 30
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish only the tested image and record its digest
        env:
          REQUEST_IMAGE: ${{ steps.image.outputs.tag }}
          REQUEST_IMAGE_NAME: ${{ steps.image.outputs.name }}
        shell: bash
        run: |
          docker push "$REQUEST_IMAGE"
          reference=$(docker image inspect "$REQUEST_IMAGE" --format '{{index .RepoDigests 0}}')
          [[ "$reference" == "$REQUEST_IMAGE_NAME"@sha256:* ]]
          echo "$reference" > "$RUNNER_TEMP/request-image-evidence/image-reference.txt"
          {
            echo '### Tested request environment'
            echo "Image: \`$reference\`"
            echo 'HTML/PDF, artifact integrity and preparation reuse passed inside the container with networking disabled.'
            echo 'The existing report workflow has not been switched to this image yet.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: request-image-reference-${{ github.run_id }}
          path: ${{ runner.temp }}/request-image-evidence/image-reference.txt
          if-no-files-found: error
          retention-days: 30
