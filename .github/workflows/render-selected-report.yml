name: Render selected stakeholder report
run-name: Selected report ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Unique UI request identifier
        required: true
        type: string
      lineage_run_id:
        description: Successful data-update workflow run containing the source artifact
        required: true
        type: string
      audience:
        description: Report stakeholder
        required: true
        type: choice
        options: [researcher, policy_maker, general_public]
      dataset_ids_json:
        description: JSON array of selected lineage dataset IDs
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.6"
          cache: pip
          cache-dependency-path: scripts/health_pipeline/requirements.lock.txt
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3.2"
          use-public-rspm: true
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.3.353"
          tinytex: true
        env:
          GH_TOKEN: ${{ github.token }}
      - run: Rscript workflow/restore_r.R
      - run: python -m pip install -r scripts/health_pipeline/requirements.lock.txt
      - name: Download exact versioned lineage artifact
        uses: actions/download-artifact@v4
        with:
          name: health-report-${{ inputs.lineage_run_id }}
          run-id: ${{ inputs.lineage_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: lineage
      - name: Render from selected lineage data
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          AUDIENCE: ${{ inputs.audience }}
          SOURCE_RUN_ID: ${{ inputs.lineage_run_id }}
          DATASET_IDS_JSON: ${{ inputs.dataset_ids_json }}
        run: |
          python scripts/health_pipeline/render_selected.py \
            --lineage-root lineage \
            --audience "$AUDIENCE" \
            --selected-ids-json "$DATASET_IDS_JSON" \
            --source-run-id "$SOURCE_RUN_ID" \
            --request-id "$REQUEST_ID" \
            --output-dir "results/selected_reports/$REQUEST_ID"
      - name: Upload selected report and provenance
        uses: actions/upload-artifact@v4
        with:
          name: selected-report-${{ inputs.request_id }}
          path: results/selected_reports/${{ inputs.request_id }}/
          retention-days: 30
