name: Build requested health report
on:
  push:
    branches: [test]
  workflow_dispatch:
    inputs:
      request_json:
        description: 'Request v1.0 JSON: schema_version, request_id, audience, datasets, formats'
        required: true
        type: string
permissions:
  contents: read
  packages: read
jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/larsebaumann/health_report_generator-request-test@sha256:86f29ed4333f29648d13bfa007b157d232abc196d720edb41d4d2c83a79e721a
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      env:
        REQUEST_ENVIRONMENT_IMAGE: ghcr.io/larsebaumann/health_report_generator-request-test@sha256:86f29ed4333f29648d13bfa007b157d232abc196d720edb41d4d2c83a79e721a
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Verify preinstalled environment matches dependency locks
        run: |
          python - <<'PY'
          from pathlib import Path
          pairs = [
              ('scripts/health_pipeline/requirements.lock.txt', '/opt/build/requirements.lock.txt'),
              ('renv.lock', '/opt/build/renv.lock'),
          ]
          for current, installed in pairs:
              if Path(current).read_bytes() != Path(installed).read_bytes():
                  raise SystemExit(f'{current} differs from the tested image. Build/test a new image and update the pinned digest.')
          print('Dependency locks match the prebuilt image.')
          PY
          python --version
          snakemake --version
          Rscript --version
          quarto --version
      - name: Validate request
        env:
          REQUEST_JSON: ${{ inputs.request_json }}
          REQUEST_EVENT: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts/health_pipeline')
          from request_pipeline import read_request
          if os.environ['REQUEST_EVENT'] == 'push':
              request_text = Path('examples/requests/public-health.json').read_text()
          else:
              request_text = os.environ['REQUEST_JSON']
          Path('request.json').write_text(request_text)
          request = read_request('request.json')
          print('Audience:', request['audience'])
          print('Datasets:', ', '.join(request['datasets']))
          print('Formats:', ', '.join(request['formats']))
          PY
      - name: Regression tests for code pushes
        if: github.event_name == 'push'
        run: python -m pytest -q
      - name: Generate requested report using the installed environment
        run: snakemake --cores 2 --config request_file=request.json
      - uses: actions/upload-artifact@v4
        with:
          name: requested-health-report-${{ github.run_id }}
          path: |
            results/requests/
            results/snapshots/
          if-no-files-found: error
          retention-days: 30
