name: Build requested health report
on:
  push:
    branches: [test, integration/marimo-reporting]
  workflow_dispatch:
    inputs:
      request_id:
        description: Unique Marimo request identifier
        required: true
        type: string
      lineage_run_id:
        description: Marimo's selected upstream data-run identifier
        required: true
        type: string
      audience:
        description: Report audience selected in Marimo
        required: true
        type: choice
        options: [researcher, health_institution, public]
      dataset_ids_json:
        description: JSON array of Marimo dataset IDs
        required: true
        type: string
      formats_json:
        description: JSON array of requested formats; Marimo may omit this field
        required: false
        default: '["html", "pdf"]'
        type: string
permissions:
  contents: read
  packages: read
jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/larsebaumann/health_report_generator-request-test@sha256:24be927ee62502369d33190fd7c0fff5282e7841be6ff939337732cd557fea12
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      env:
        REQUEST_ENVIRONMENT_IMAGE: ghcr.io/larsebaumann/health_report_generator-request-test@sha256:24be927ee62502369d33190fd7c0fff5282e7841be6ff939337732cd557fea12
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Verify preinstalled environment matches dependency locks
        run: |
          python - <<'PY'
          from pathlib import Path
          pairs = [
              ('scripts/health_pipeline/requirements.lock.txt', '/opt/build/requirements.lock.txt'),
              ('renv.lock', '/opt/build/renv.lock'),
          ]
          for current, installed in pairs:
              if Path(current).read_bytes() != Path(installed).read_bytes():
                  raise SystemExit(f'{current} differs from the tested image. Build/test a new image and update the pinned digest.')
          print('Dependency locks match the prebuilt image.')
          PY
          python --version
          snakemake --version
          Rscript --version
          quarto --version
      - name: Validate request
        env:
          REQUEST_EVENT: ${{ github.event_name }}
          REQUEST_ID: ${{ inputs.request_id }}
          LINEAGE_RUN_ID: ${{ inputs.lineage_run_id }}
          AUDIENCE: ${{ inputs.audience }}
          DATASET_IDS_JSON: ${{ inputs.dataset_ids_json }}
          FORMATS_JSON: ${{ inputs.formats_json }}
        run: |
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts/health_pipeline')
          from request_pipeline import read_request
          if os.environ['REQUEST_EVENT'] == 'push':
              request = json.loads(Path('examples/requests/public-health.json').read_text())
          else:
              request = {
                  'schema_version': '1.0',
                  'request_id': os.environ['REQUEST_ID'],
                  'lineage_run_id': os.environ['LINEAGE_RUN_ID'],
                  'audience': os.environ['AUDIENCE'],
                  'datasets': json.loads(os.environ['DATASET_IDS_JSON']),
                  'formats': json.loads(os.environ['FORMATS_JSON']),
              }
          Path('request.json').write_text(json.dumps(request, indent=2) + '\n')
          request = read_request('request.json')
          print('Audience:', request['audience'])
          print('Datasets:', ', '.join(request['datasets']))
          print('Formats:', ', '.join(request['formats']))
          PY
      - name: Regression tests for code pushes
        if: github.event_name == 'push'
        run: python -m pytest -q
      - name: Identify source snapshot and preparation cache
        id: preparation
        run: python scripts/health_pipeline/request_pipeline.py cache-plan
      - name: Restore matching prepared data
        id: prepared-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.preparation.outputs.prepared }}
          key: ${{ steps.preparation.outputs.key }}
      - name: Verify restored preparation
        if: steps.prepared-cache.outputs.cache-hit == 'true'
        env:
          PREPARED: ${{ steps.preparation.outputs.prepared }}
          SNAPSHOT_ID: ${{ steps.preparation.outputs.snapshot_id }}
        run: python scripts/health_pipeline/request_pipeline.py cache-check --prepared "$PREPARED" --snapshot-id "$SNAPSHOT_ID"
      - name: Generate requested report using the installed environment
        env:
          SNAPSHOT: ${{ steps.preparation.outputs.snapshot }}
        run: snakemake --cores 2 --config request_file=request.json snapshot_manifest="$SNAPSHOT"
      - name: Verify preparation before saving
        env:
          PREPARED: ${{ steps.preparation.outputs.prepared }}
          SNAPSHOT_ID: ${{ steps.preparation.outputs.snapshot_id }}
        run: python scripts/health_pipeline/request_pipeline.py cache-check --prepared "$PREPARED" --snapshot-id "$SNAPSHOT_ID"
      - name: Save prepared data for later requests
        if: steps.prepared-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.preparation.outputs.prepared }}
          key: ${{ steps.preparation.outputs.key }}
      - name: Record preparation reuse
        env:
          CACHE_HIT: ${{ steps.prepared-cache.outputs.cache-hit }}
          CACHE_KEY: ${{ steps.preparation.outputs.key }}
        run: |
          python - <<'PY'
          import os
          status = 'Reused verified prepared data' if os.environ['CACHE_HIT'] == 'true' else 'Prepared data built; cache save requested'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(f"### Preparation cache\n{status}\n\nKey: `{os.environ['CACHE_KEY']}`\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: requested-health-report-${{ github.run_id }}
          path: |
            results/requests/
            results/snapshots/
          if-no-files-found: error
          retention-days: 30
