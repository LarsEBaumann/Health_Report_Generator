name: Build requested health report
on:
  workflow_dispatch:
    inputs:
      request_json:
        description: 'Request v1.0 JSON: schema_version, request_id, audience, datasets, formats'
        required: true
        type: string
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.6'
          cache: pip
          cache-dependency-path: scripts/health_pipeline/requirements.lock.txt
      - run: pip install -r scripts/health_pipeline/requirements.lock.txt
      - name: Validate request before installing rendering tools
        env:
          REQUEST_JSON: ${{ inputs.request_json }}
        run: |
          python - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts/health_pipeline')
          from request_pipeline import read_request
          Path('request.json').write_text(os.environ['REQUEST_JSON'])
          read_request('request.json')
          PY
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.2'
          use-public-rspm: true
      - run: Rscript workflow/restore_r.R
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.3.353'
          tinytex: true
      - run: python -m pytest -q
      - run: snakemake --cores 2 --config request_file=request.json
      - uses: actions/upload-artifact@v4
        with:
          name: requested-health-report-${{ github.run_id }}
          path: |
            results/requests/
            results/snapshots/
          if-no-files-found: error
          retention-days: 30
