name: Validate and build reports
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'
permissions:
  contents: read
jobs:
  reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.6'
          cache: pip
          cache-dependency-path: scripts/health_pipeline/requirements.lock.txt
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.2'
          use-public-rspm: true
      - run: Rscript workflow/restore_r.R
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.3.353'
          tinytex: true
      - run: pip install -r scripts/health_pipeline/requirements.lock.txt
      - run: python -m pytest -q
      - run: snakemake --config data_root=Data --cores 2
      - run: Rscript tests/shiny_smoke.R results/reports/public_health_expert/app
      - run: Rscript tests/dashboard_smoke.R results/reports/public_health_expert/app
      - name: Upload only a successful complete release
        uses: actions/upload-artifact@v4
        with:
          name: health-report-${{ github.sha }}
          path: results/
          retention-days: 30
