&lt;h1&gt;Where the findings come from.&lt;/h1&gt;
&lt;div class=&quot;meta&quot;&gt;&lt;span&gt;FOPH Infectious Disease Dashboard exports&lt;/span&gt;&lt;span class=&quot;snapshot&quot;&gt;Snapshot f1484622df748314&lt;/span&gt;&lt;/div&gt;
&lt;button class=&quot;link&quot; data-back-findings&gt;← Back to findings&lt;/button&gt;
&lt;div class=&quot;steps&quot;&gt;&lt;section class=&quot;step&quot;&gt;&lt;span&gt;01 / Source&lt;/span&gt;&lt;h3&gt;National surveillance exports&lt;/h3&gt;&lt;p&gt;Archived case counts and descriptions, with file fingerprints.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;step&quot;&gt;&lt;span&gt;02 / Selection&lt;/span&gt;&lt;h3&gt;Like-for-like comparisons&lt;/h3&gt;&lt;p&gt;The same diseases, geography and complete years in every group total.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;step&quot;&gt;&lt;span&gt;03 / Calculation&lt;/span&gt;&lt;h3&gt;Counts first, then change&lt;/h3&gt;&lt;p&gt;Sum selected case counts. Compare 2025 with the corresponding 2019 total.&lt;/p&gt;&lt;/section&gt;&lt;/div&gt;
&lt;div class=&quot;audit-grid&quot;&gt;&lt;section class=&quot;panel&quot;&gt;&lt;h2&gt;What is included?&lt;/h2&gt;&lt;div class=&quot;source-line&quot;&gt;&lt;span&gt;Geography&lt;/span&gt;&lt;strong&gt;Switzerland + Liechtenstein&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;source-line&quot;&gt;&lt;span&gt;Comparison years&lt;/span&gt;&lt;strong&gt;2019 and 2021–2025&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;source-line&quot;&gt;&lt;span&gt;Viral group&lt;/span&gt;&lt;strong&gt;6 diseases&lt;/strong&gt;&lt;/div&gt;&lt;p class=&quot;caption&quot;&gt;Hepatitis A, B, C and E; HIV; influenza.&lt;/p&gt;&lt;div class=&quot;source-line&quot;&gt;&lt;span&gt;Bacterial group&lt;/span&gt;&lt;strong&gt;5 diseases&lt;/strong&gt;&lt;/div&gt;&lt;p class=&quot;caption&quot;&gt;Campylobacteriosis, chlamydia, EHEC, gonorrhoea and shigellosis.&lt;/p&gt;&lt;div class=&quot;footnote&quot;&gt;COVID-19 and AIDS are excluded from group totals. Sentinel estimates are not combined with mandatory case notifications. The sensitivity comparison also removes influenza.&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;panel&quot;&gt;&lt;h2&gt;Trace a finding, not a code&lt;/h2&gt;&lt;h3&gt;“Viral notifications were 124% above 2019.”&lt;/h3&gt;&lt;div class=&quot;source-line&quot;&gt;&lt;span&gt;Selected cases in 2025&lt;/span&gt;&lt;strong&gt;37,606&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;source-line&quot;&gt;&lt;span&gt;Selected cases in 2019&lt;/span&gt;&lt;strong&gt;16,772&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;source-line&quot;&gt;&lt;span&gt;Calculation&lt;/span&gt;&lt;strong&gt;(37,606 − 16,772) ÷ 16,772&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;source-line&quot;&gt;&lt;span&gt;Result, expressed as a percentage&lt;/span&gt;&lt;strong&gt;+124.2%&lt;/strong&gt;&lt;/div&gt;&lt;details&gt;&lt;summary&gt;Inspect one contributing source record&lt;/summary&gt;&lt;div class=&quot;source-line&quot;&gt;&lt;span&gt;Influenza, 2025&lt;/span&gt;&lt;strong&gt;34,984 case notifications&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;source-line&quot;&gt;&lt;span&gt;Archived file&lt;/span&gt;&lt;code&gt;INFLUENZA_oblig/data.csv&lt;/code&gt;&lt;/div&gt;&lt;div class=&quot;source-line&quot;&gt;&lt;span&gt;CSV record, including header&lt;/span&gt;&lt;strong&gt;31029&lt;/strong&gt;&lt;/div&gt;&lt;p class=&quot;caption&quot;&gt;The complete lineage export contains all contributing records, not only this example.&lt;/p&gt;&lt;/details&gt;&lt;/section&gt;&lt;/div&gt;
&lt;section class=&quot;panel wide-panel&quot;&gt;&lt;h2&gt;How to read the figures&lt;/h2&gt;&lt;div class=&quot;table-wrap&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Figure&lt;/th&gt;&lt;th&gt;What it measures&lt;/th&gt;&lt;th&gt;How to interpret it&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Reported cases&lt;/td&gt;&lt;td&gt;Sum of selected annual case counts&lt;/td&gt;&lt;td&gt;Volume of notifications, not all infections&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Change from 2019&lt;/td&gt;&lt;td&gt;Percentage above or below the 2019 count&lt;/td&gt;&lt;td&gt;+100% means twice as many; 0% means unchanged&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Disease comparison&lt;/td&gt;&lt;td&gt;Each disease’s change from its own baseline&lt;/td&gt;&lt;td&gt;Large percentage changes can start from small counts&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;div class=&quot;footnote&quot;&gt;Definitions correspond to the archived stakeholder settings and shared calculation tables. Percentages describe change; they do not establish causes, disease severity or statistical significance.&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;panel wide-panel&quot;&gt;&lt;h2&gt;Data quality and reproducibility&lt;/h2&gt;&lt;p&gt;Source warnings concern excluded wastewater datasets. Selected comparisons require complete periods, valid counts and an explicit population definition.&lt;/p&gt;&lt;details&gt;&lt;summary&gt;Technical checks and downloadable audit files&lt;/summary&gt;&lt;p class=&quot;caption&quot;&gt;Production companion report: source registry, dataset exclusions, calculation lineage, quality checks and full fingerprints. Original record identifiers stay here, outside the findings report.&lt;/p&gt;&lt;div class=&quot;source-line&quot;&gt;&lt;span&gt;Snapshot&lt;/span&gt;&lt;code&gt;f1484622df74831453d66fb36cfc9fab002bd0695385195143930328d4f74653&lt;/code&gt;&lt;/div&gt;&lt;div class=&quot;source-line&quot;&gt;&lt;span&gt;Reproduction&lt;/span&gt;&lt;strong&gt;Archived inputs + saved settings + versioned code&lt;/strong&gt;&lt;/div&gt;&lt;/details&gt;&lt;/section&gt;
