services:
  report:
    build: .
    working_dir: /app
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    volumes:
      - .:/app
      - ./.cache/uv:/tmp/uv-cache
    environment:
      UV_CACHE_DIR: /tmp/uv-cache
      LINEAGE_DIR: ${LINEAGE_DIR:-/app/data/lineage}
      LINEAGE_RUN_ID: ${LINEAGE_RUN_ID:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-LarsEBaumann/Health_Report_Generator}
