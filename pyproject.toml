[project]
name = "health-report-generator"
version = "0.1.0"
requires-python = ">=3.11.6,<3.12"
dependencies = [
    "marimo>=0.25.1",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[tool.ruff]
# Lint only: the existing compact style is kept; `ruff format` is not enforced.
target-version = "py311"
extend-exclude = [
    "Health_Report_Generator-test",
    "scripts/health_pipeline/example_output",
]

[tool.ruff.lint]
# Syntax errors, undefined names, unused imports/variables and other pyflakes defects.
select = ["E9", "F"]
