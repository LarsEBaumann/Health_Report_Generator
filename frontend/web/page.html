<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Infection Data Explorer</title>
</head>
<body>
<style id="app-css">
/* Start page picks an audience; each audience gets a sticky filter bar, the dashboard tabs
   its stakeholder config asks for, a 6-column panel grid, and a report builder.
   Fonts are the system stack on purpose: this page must work with no network. */
:root,.xl{
  --bg:#F3F6F5;--surface:#FFFFFF;--surface-2:#EAF0EF;--ink:#132120;--ink-2:#3C4D4B;--muted:#647573;--line:#D8E1DF;
  --accent:#0A6B70;--accent-ink:#FFFFFF;--accent-soft:#DCEEEE;--accent-2:#B4561A;
  --ok:#2B7A4B;--ok-soft:#E0F1E6;--warn:#94600F;--warn-soft:#FBF0D9;--crit:#B8382A;--crit-soft:#F9E2DE;--prev:#A7B4B2;
  --who-1:#0A6B70;--who-1-bg:#DCEEEE;--who-2:#3A4FB0;--who-2-bg:#E3E7F8;--who-3:#8A3E72;--who-3-bg:#F7E6F1;
  --scrim:rgb(10 22 21 / .5);
  --f-display:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-body:"Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:ui-monospace,"Cascadia Mono","SFMono-Regular",Menlo,Consolas,monospace;
}
.xl{color-scheme:light;color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1716;--surface:#16211F;--surface-2:#1D2A28;--ink:#E4ECEA;--ink-2:#B4C3C0;--muted:#8A9C99;--line:#2A3936;
  --accent:#4DB3B5;--accent-ink:#06201F;--accent-soft:#163A3A;--accent-2:#E39058;
  --ok:#62C08A;--ok-soft:#173326;--warn:#E2B356;--warn-soft:#3A2E14;--crit:#F07D6B;--crit-soft:#3F1F1A;--prev:#5E6E6B;
  --scrim:rgb(0 0 0 / .6);
  --who-1:#4DB3B5;--who-1-bg:#163A3A;--who-2:#8FA3F0;--who-2-bg:#1E2544;--who-3:#DF93C6;--who-3-bg:#3A2031;
color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1716;--surface:#16211F;--surface-2:#1D2A28;--ink:#E4ECEA;--ink-2:#B4C3C0;--muted:#8A9C99;--line:#2A3936;
  --accent:#4DB3B5;--accent-ink:#06201F;--accent-soft:#163A3A;--accent-2:#E39058;
  --ok:#62C08A;--ok-soft:#173326;--warn:#E2B356;--warn-soft:#3A2E14;--crit:#F07D6B;--crit-soft:#3F1F1A;--prev:#5E6E6B;
  --scrim:rgb(0 0 0 / .6);
  --who-1:#4DB3B5;--who-1-bg:#163A3A;--who-2:#8FA3F0;--who-2-bg:#1E2544;--who-3:#DF93C6;--who-3-bg:#3A2031;
color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding:0 16px 48px;margin:0}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{text-wrap:balance}
.ic{width:18px;height:18px;flex:none}
.ic.lg{width:26px;height:26px}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 20px;padding:20px 0 14px}
.brand{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;color:var(--ink);cursor:pointer;text-align:left}
.mark{width:40px;height:40px;color:var(--accent);flex:none}
.brand h1{font-family:var(--f-display);font-size:1.4rem;font-weight:700;margin:0;letter-spacing:-.01em;line-height:1.1}
.tagline{display:block;margin:2px 0 0;color:var(--muted);font-size:.84rem}
.hright{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.switch{display:flex;align-items:center;gap:8px;white-space:nowrap}
.lbl,.field label{font-family:var(--f-mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
select{font:inherit;font-size:.92rem;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-width:min(170px,100%)}

.hero{padding:36px 0 26px;max-width:720px}
.facts{display:flex;flex-wrap:wrap;gap:10px 28px;margin:18px 0 0}
.facts div{min-width:0}
.facts b{display:block;font-family:var(--f-display);font-size:1.5rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.facts span{font-size:.76rem;color:var(--muted);font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.06em}
.hero h2{font-family:var(--f-display);font-size:clamp(1.8rem,4.4vw,2.8rem);font-weight:700;letter-spacing:-.02em;line-height:1.08;margin:0}
.eyebrow{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}
.lede{color:var(--ink-2);max-width:66ch;margin:10px 0 0}
.setup{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:flex-end;padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.setup .field{flex:1 1 200px}
.setup select{width:100%}
/* One column per stakeholder, sharing the full width; they wrap on narrow screens. */
.who-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px}
/* Each stakeholder carries its own colour. These are identity hues, deliberately not the
   green/amber/red used for quality and level status elsewhere on the page. */
.who-pick{--who:var(--who-1);--who-bg:var(--who-1-bg);
  display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;padding:22px 16px;
  background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--who);
  border-radius:14px;cursor:pointer;font:inherit;color:var(--ink);text-align:center;
  transition:border-color .15s,transform .15s,background .15s}
.who-row .who-pick:nth-child(2){--who:var(--who-2);--who-bg:var(--who-2-bg)}
.who-row .who-pick:nth-child(3){--who:var(--who-3);--who-bg:var(--who-3-bg)}
.who-pick:hover{border-color:var(--who);border-top-color:var(--who);background:var(--who-bg)}
.who-pick:focus-visible{outline:2px solid var(--who);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.who-pick:hover{transform:translateY(-2px)}}
.who-pick .who-ic{width:52px;height:52px;border-radius:14px;background:var(--who-bg);color:var(--who);display:grid;place-items:center}
.who-pick:hover .who-ic{background:var(--surface)}
.who-pick b{font-size:1rem;font-weight:650;line-height:1.2;color:var(--who)}
.who-pick small{font-size:.72rem;color:var(--muted);font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.05em}
.who-pick[disabled]{opacity:.55;cursor:not-allowed}
.who-pick[disabled]:hover{border-color:var(--line);border-top-color:var(--who);background:var(--surface);transform:none}
.whoami{font-family:var(--f-display);font-size:clamp(1.35rem,2.6vw,1.75rem);font-weight:700;letter-spacing:-.01em;margin:30px 0 14px}

.filters{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;padding:10px 0 12px;border-bottom:1px solid var(--line);margin-bottom:16px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.access{display:inline-flex;gap:8px;align-items:center;font-size:.84rem;font-weight:500;padding:6px 12px;border-radius:999px;white-space:nowrap;margin-left:auto;background:var(--ok-soft);color:var(--ok)}
.dtabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:11px;overflow-x:auto;margin-bottom:24px}
.dtab{flex:none;border:0;background:transparent;color:var(--ink-2);font:500 .9rem var(--f-body);padding:9px 14px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap}
.dtab:hover{color:var(--ink)}
.dtab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .1)}
.dtab.rep{margin-left:auto;color:var(--accent)}
.dtab.rep[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
/* The text takes every column the button does not, so a long audience title fills the
   width instead of being balanced into short lines in a narrow box. */
.viewhead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px 28px;align-items:end;margin-bottom:26px}
.viewhead>div{min-width:0}
.viewhead h2{font-family:var(--f-display);font-size:clamp(1.5rem,3.4vw,2.2rem);font-weight:700;margin:4px 0 0;letter-spacing:-.015em;line-height:1.2;text-wrap:pretty}
.viewhead .lede{max-width:none;margin-top:12px}
@media (max-width:680px){.viewhead{grid-template-columns:minmax(0,1fr)}.viewhead .btn{justify-self:start}}

.dgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}
.s-full{grid-column:span 6}.s-half{grid-column:span 3}.s-wide{grid-column:span 4}.s-narrow{grid-column:span 2}
@media (max-width:900px){.dgrid>*{grid-column:1/-1}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.panel h3{font-size:1rem;font-weight:600;margin:0;display:flex;gap:8px;align-items:center}
.panel h3 .ic{color:var(--accent)}
.sub{color:var(--muted);font-size:.85rem;margin:2px 0 12px}
.ph{display:flex;justify-content:space-between;gap:10px 12px;flex-wrap:wrap;align-items:flex-start}
.ph>div{min-width:0}
.bare{min-width:0}
.bare-h{margin:0 0 8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px}
.xl .kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.kpi .k{font-size:.82rem;color:var(--muted)}
.kpi .v{font-family:var(--f-display);font-size:1.75rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2;margin-top:2px}
.kpi .v small{font-family:var(--f-body);font-size:.85rem;font-weight:400;color:var(--muted)}
.kpi .s{font-size:.8rem;color:var(--ink-2)}
.up{color:var(--crit)}.down{color:var(--ok)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font:500 .82rem var(--f-body);padding:5px 11px;border-radius:999px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.8rem;color:var(--ink-2);margin-top:8px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.legend i.dash{background:none;border-top:2px dashed var(--crit);height:0}
.smalls{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
.small-t{font-size:.84rem;font-weight:600;margin:0 0 2px}
.small-s{font-size:.74rem;color:var(--muted);margin:0 0 4px;font-family:var(--f-mono)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(0,11rem) minmax(0,1fr) 4.4rem;gap:10px;align-items:center;font-size:.86rem}
.bar .t{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.bar .f{display:block;height:100%;border-radius:5px;background:var(--accent)}
.bar .n{font-family:var(--f-mono);font-size:.8rem;text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:480px){.bar{grid-template-columns:minmax(0,7rem) minmax(0,1fr) 3.6rem}}
.tbl-wrap{overflow-x:auto;max-height:420px}
table{width:100%;border-collapse:collapse;font-size:.87rem;font-variant-numeric:tabular-nums}
th{text-align:left;font-weight:500;color:var(--muted);font-size:.78rem;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--surface)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
table.compact td{padding:5px 10px}
.mono{font-family:var(--f-mono);font-size:.82rem}
.linkish{background:none;border:0;padding:0;font:500 .88rem var(--f-body);color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-align:left}
.trunc{display:inline-block;max-width:24ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
.pill{display:inline-block;font-size:.75rem;font-weight:500;padding:2px 9px;border-radius:999px;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-crit{background:var(--crit-soft);color:var(--crit)}.p-acc{background:var(--accent-soft);color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 .88rem var(--f-body);padding:8px 14px;border-radius:9px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{padding:12px 18px;font-size:.95rem}
.btn[disabled]{opacity:.6;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
dl.meta{display:grid;grid-template-columns:minmax(0,12rem) minmax(0,1fr);gap:9px 16px;margin:0;font-size:.88rem}
dl.meta dt{color:var(--muted)}dl.meta dd{margin:0}
@media (max-width:520px){dl.meta{grid-template-columns:minmax(0,1fr);gap:2px}dl.meta dt{margin-top:8px}}
.notes{margin:10px 0 0;padding-left:18px;font-size:.84rem;color:var(--ink-2)}
.notes li+li{margin-top:4px}
.warnline{font-size:.78rem;color:var(--muted);margin:10px 0 0}
.empty{color:var(--muted);font-size:.88rem;padding:10px 0;margin:0}
.note{margin:14px 0 0;padding:14px 16px;border-radius:10px;font-size:.9rem;border:1px solid var(--line);background:var(--surface)}
.note.ok{background:var(--ok-soft);border-color:var(--ok)}
.note.err{background:var(--crit-soft);border-color:var(--crit)}
.note a{color:var(--accent);font-weight:650}
.spin{display:inline-block;width:15px;height:15px;margin-right:9px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:turn .8s linear infinite;vertical-align:-2px}
@keyframes turn{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
ul.files{margin:0;padding:0;list-style:none;font-size:.88rem}
ul.files li{padding:8px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
ul.files li:last-child{border-bottom:0}
ul.files a{color:var(--accent);font-weight:500}
ul.files .when{color:var(--muted);font-size:.8rem;font-family:var(--f-mono)}
.rep-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,4fr);gap:16px}
@media (max-width:900px){.rep-grid{grid-template-columns:minmax(0,1fr)}}
.cover-top{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.cover-ic{width:56px;height:68px;border-radius:6px 16px 6px 6px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none;font:600 .74rem var(--f-mono)}
.cover-top h3{font-family:var(--f-display);font-size:1.25rem;font-weight:700;line-height:1.15}
.status{font-size:.86rem;color:var(--ink-2);min-height:1.3em;margin:0}
.repsec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0;overflow-x:auto}
.repsec>h3{font-size:1rem;font-weight:600;margin:0 0 10px;display:flex;gap:8px;align-items:center}
.repsec>h3 .ic{color:var(--accent)}
.repsec .body>p:first-child{margin-top:0}
.repsec table{margin:8px 0}
.repsec td,.repsec th{white-space:nowrap}
.repsec h3,.repsec h4{font-size:.95rem;margin:16px 0 6px}
.repsec details{margin:10px 0 0}
.repsec summary{cursor:pointer;color:var(--accent);font-weight:500;font-size:.88rem}
.repsec pre{background:var(--surface-2);border-radius:8px;padding:12px 14px;overflow-x:auto;font-size:12px;max-height:340px}
.repsec a{color:var(--accent)}
.figpanel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.figpanel h3{font-size:1rem;font-weight:600;margin:0;display:flex;gap:8px;align-items:center}
.figpanel h3 .ic{color:var(--accent)}
.figbox{width:100%;min-height:260px;margin-top:6px}
.figloading{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:.88rem;padding:18px 0}
.viewer{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.vbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.vbar h3{font-family:var(--f-display);font-size:1.05rem;font-weight:700;margin:0;display:flex;gap:8px;align-items:center}
.vbar .mono{color:var(--muted)}
.viewer iframe{display:block;width:100%;height:78vh;min-height:520px;border:0;background:#fff}
.tall iframe{height:140vh}
dl.prov{display:grid;grid-template-columns:minmax(0,13rem) minmax(0,1fr);gap:8px 16px;margin:0;font-size:.87rem}
dl.prov dt{color:var(--muted)}
dl.prov dd{margin:0;word-break:break-word}
dl.prov dd.hash{font-family:var(--f-mono);font-size:.78rem}
@media (max-width:560px){dl.prov{grid-template-columns:minmax(0,1fr);gap:2px}dl.prov dt{margin-top:8px}}
details.more{margin:12px 0 0;border-top:1px solid var(--line);padding-top:10px}
details.more summary{cursor:pointer;font-weight:500;font-size:.88rem;color:var(--accent)}
details.more[open] summary{margin-bottom:10px}
@media (prefers-reduced-motion:no-preference){#dash{animation:fade .25s ease-out}@keyframes fade{from{opacity:.4}to{opacity:1}}}
</style>

<div class="wrap">
<header class="top">
  <button class="brand" data-home aria-label="Infection Data Explorer, back to the start page">
    <svg class="mark" viewBox="0 0 40 40" fill="none" aria-hidden="true"><circle cx="20" cy="20" r="17" stroke="currentColor" stroke-width="2.4"/><circle cx="20" cy="20" r="12" stroke="currentColor" stroke-width="1.2" stroke-dasharray="2 3"/><circle cx="15" cy="16" r="2.6" fill="currentColor"/><circle cx="24" cy="14" r="1.6" fill="currentColor"/><circle cx="25" cy="24" r="3" fill="currentColor"/><circle cx="16" cy="25" r="1.4" fill="currentColor"/></svg>
    <span><h1>Infection Data Explorer</h1><span class="tagline">One data source, many audiences</span></span>
  </button>
  <div class="hright">
    <div class="switch" id="switch" hidden>
      <label class="lbl" for="f-who">Viewing as</label>
      <select id="f-who"></select>
    </div>
  </div>
</header>

<main>
<section id="home">
  <div class="hero">
    <h2>Who is looking at the data today?</h2>
    <div class="facts" id="facts"></div>
  </div>
  <div class="setup">
    <div class="field"><label for="h-cls">Pathogen class</label><select id="h-cls"></select></div>
    <div class="field"><label for="h-year">Year</label><select id="h-year"></select></div>
  </div>
  <h3 class="whoami">Who am I?</h3>
  <div class="who-row" id="who-row"></div>
</section>

<section id="app" hidden>
  <div class="filters">
    <div class="field"><label for="f-cls">Pathogen class</label>
      <select id="f-cls"><option value="all">All</option><option value="viral">Viral</option><option value="bacterial">Bacterial</option></select></div>
    <div class="field"><label for="f-year">Year</label><select id="f-year"></select></div>
    <span class="access" id="access"></span>
  </div>
  <nav class="dtabs" role="tablist" aria-label="Dashboards" id="dtabs"></nav>
  <div id="dash"></div>
</section>
</main>
</div>

<script>
const P={
  chart:'<path d="M4 20V4M4 20h16"/><circle cx="9" cy="14" r="1.2"/><circle cx="13" cy="9" r="1.2"/><circle cx="17" cy="11" r="1.2"/>',
  trend:'<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
  list:'<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/>',
  quality:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 13l2 2 4-4"/>',

  layers:'<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/>',

const icon=(n,c="ic")=>`<svg class="${c}" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]||""}</svg>`;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const num=v=>v==null?"—":Number(v).toLocaleString("en-US",{maximumFractionDigits:0});
const dec=(v,d=1)=>v==null?"—":Number(v).toFixed(d);
const pct=v=>v==null?"—":(v>=0?"+":"−")+Math.abs(v).toFixed(0)+"%";
const CLASS_ICON={researcher:"flask",health_institution:"shield",public:"users"};

const S={who:null,tab:null,cls:"all",year:null,chosen:new Set(),ctx:null,data:{},figs:{},secs:{},labels:{}};
const audience=()=>S.ctx.audiences.find(a=>a.id===S.who);
const payload=()=>S.data[S.who];
const tabs=()=>audience().tabs;

/* ---------- charts: inline SVG, same colors as the page ---------- */
const T={grid:"stroke:var(--line);stroke-width:1",tick:"fill:var(--muted);font-size:11px;font-family:var(--f-mono)",lab:"fill:var(--ink-2);font-size:12px;font-family:var(--f-body)",mlab:"fill:var(--ink);font-size:11px;font-weight:500;font-family:var(--f-mono);paint-order:stroke;stroke:var(--surface);stroke-width:3px"};
const COLS=["var(--accent)","var(--accent-2)","var(--warn)","var(--ok)","var(--prev)"];
function niceMax(v){if(v<=0)return 1;const e=Math.pow(10,Math.floor(Math.log10(v))),n=v/e;return(n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*e}
function fmtTick(v){const a=Math.abs(v);if(a>=1e6)return(v/1e6)+"M";if(a>=1000)return(v/1000)+"k";return String(Number(v.toPrecision(3)))}
function lineChart(o){const w=o.w||640,h=o.h||240,pad={l:o.pl||50,r:18,t:16,b:30},cw=w-pad.l-pad.r,ch=h-pad.t-pad.b;
  const vals=o.series.flatMap(s=>s.values.filter(v=>v!=null));
  if(!vals.length)return`<p class="empty">No data for this selection.</p>`;
  const lo=o.min!=null?o.min:Math.min(0,...vals),hi=o.max||niceMax(Math.max(...vals,...(o.lines||[]).map(l=>l.y))*1.08);
  const n=o.labels.length,x=i=>n===1?pad.l+cw/2:pad.l+i*cw/(n-1),y=v=>pad.t+ch-(v-lo)/(hi-lo||1)*ch;
  let s=`<svg class="chart" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(o.aria||"Chart")}">`;
  for(let k=0;k<=4;k++){const v=lo+(hi-lo)*k/4,yy=y(v).toFixed(1);
    s+=`<line x1="${pad.l}" x2="${w-pad.r}" y1="${yy}" y2="${yy}" style="${T.grid}"/><text x="${pad.l-8}" y="${+yy+4}" text-anchor="end" style="${T.tick}">${fmtTick(v)}</text>`}
  const ev=o.every||Math.ceil(n/8);
  o.labels.forEach((l,i)=>{if(i%ev===0)s+=`<text x="${x(i).toFixed(1)}" y="${h-9}" text-anchor="middle" style="${T.tick}">${esc(l)}</text>`});
  (o.lines||[]).forEach(l=>{const yy=y(l.y).toFixed(1);
    s+=`<line x1="${pad.l}" x2="${w-pad.r}" y1="${yy}" y2="${yy}" style="stroke:${l.color};stroke-width:1.5;stroke-dasharray:5 4"/>`+(l.label?`<text x="${w-pad.r}" y="${+yy-6}" text-anchor="end" style="${T.mlab};fill:${l.color}">${esc(l.label)}</text>`:"")});
  o.series.forEach(se=>{const pts=se.values.map((v,i)=>v==null?null:[x(i),y(v)]).filter(Boolean);if(!pts.length)return;
    const d="M"+pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join("L");
    if(se.area)s+=`<path d="${d}L${pts.at(-1)[0].toFixed(1)},${y(lo)}L${pts[0][0].toFixed(1)},${y(lo)}Z" style="fill:${se.color};fill-opacity:.12;stroke:none"/>`;
    s+=`<path d="${d}" style="fill:none;stroke:${se.color};stroke-width:${se.width||2.2};stroke-linejoin:round;stroke-linecap:round"/>`;
    pts.forEach(p=>s+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.2" style="fill:var(--surface);stroke:${se.color};stroke-width:2"/>`)});
  return s+"</svg>"}
function miniLine(values,labels,color){const w=200,h=70,pad={l:4,r:4,t:8,b:4},cw=w-pad.l-pad.r,ch=h-pad.t-pad.b;
  const vals=values.filter(v=>v!=null);if(!vals.length)return"";
  const hi=Math.max(...vals)*1.1||1,x=i=>values.length===1?pad.l+cw/2:pad.l+i*cw/(values.length-1),y=v=>pad.t+ch-v/hi*ch;
  const pts=values.map((v,i)=>v==null?null:[x(i),y(v)]).filter(Boolean);
  const d="M"+pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join("L");
  return`<svg class="chart" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="Trend ${esc(labels[0])} to ${esc(labels.at(-1))}">`
    +`<path d="${d}L${pts.at(-1)[0].toFixed(1)},${y(0)}L${pts[0][0].toFixed(1)},${y(0)}Z" style="fill:${color};fill-opacity:.14;stroke:none"/>`
    +`<path d="${d}" style="fill:none;stroke:${color};stroke-width:2;stroke-linejoin:round"/>`
    +`<circle cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="3" style="fill:${color}"/></svg>`}
const hbars=(rows,o={})=>{const max=o.max||Math.max(...rows.map(r=>Math.abs(r[1])),1);
  return`<div class="bars">${rows.map(([l,v])=>`<div class="bar"><span>${esc(l)}</span><span class="t"><span class="f" style="width:${Math.min(100,Math.abs(v)/max*100).toFixed(1)}%;background:${o.color?o.color(v):"var(--accent)"}"></span></span><span class="n">${o.fmt?o.fmt(v):num(v)}</span></div>`).join("")}</div>`};
const kpis=rows=>`<div class="kpis">${rows.map(([k,v,s,cls])=>`<div class="kpi"><div class="k">${esc(k)}</div><div class="v ${cls||""}">${v}</div><div class="s">${s||""}</div></div>`).join("")}</div>`;
const table=(head,rows,cls="")=>rows.length?`<div class="tbl-wrap"><table class="${cls}"><thead><tr>${head.map(h=>`<th class="${h[1]?"num":""}">${esc(h[0])}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table></div>`:`<p class="empty">Nothing to show.</p>`;
const legend=items=>`<div class="legend">${items.map(([l,c,d])=>`<span><i class="${d?"dash":""}" style="${d?"":"background:"+c}"></i>${esc(l)}</span>`).join("")}</div>`;

/* ---------- selectors over the real bundle ---------- */
const inClass=r=>S.cls==="all"||r.pathogen_class===S.cls;
const diseases=()=>payload().diseases.filter(inClass);
const seriesFor=topic=>payload().series.filter(r=>r.topic===topic).sort((a,b)=>a.year-b.year);
function groupSeries(kind){const p=payload(),keep=S.cls==="all"?["viral:main","bacterial:main"]:[S.cls+":main"];
  return keep.map((subject,i)=>{const rows=p.metrics[kind].filter(m=>m.subject===subject).sort((a,b)=>a.year-b.year);
    return{subject,label:subject.split(":")[0],values:p.years.map(y=>{const m=rows.find(r=>r.year===y);return m?m.value:null}),color:COLS[i]}})}
// The audience's own group total, which already applies its exclusion rules. Summing the
// series instead would double-count AIDS against HIV, which those rules exist to prevent.
function groupTotal(year){const p=payload(),keep=S.cls==="all"?["viral:main","bacterial:main"]:[S.cls+":main"];
  const rows=p.metrics.group_total.filter(m=>m.year===year&&keep.includes(m.subject));
  return rows.length?rows.reduce((a,m)=>a+m.value,0):null}
function changeRows(){const p=payload(),ref=new Map(p.metrics.reference_change.map(m=>[m.subject,m.value])),per=new Map(p.metrics.period_change.map(m=>[m.subject,m.value]));
  return p.diseases.filter(inClass).map(d=>({...d,ref:ref.get(d.topic),per:per.get(d.topic)})).sort((a,b)=>(b.ref??-1e9)-(a.ref??-1e9))}

/* ---------- panels: one per `outputs` entry in the stakeholder config ---------- */
const PANEL={};
PANEL.headline={bare:true,t:"Key figures",html(){const p=payload(),ch=p.checks.totals,total=Object.values(ch).reduce((a,b)=>a+b,0);
  const g=changeRows().filter(r=>r.ref!=null),excluded=p.parameters["Excluded from group totals"];
  const biggest=g[0];
  return kpis([
    ["Diseases in this report",diseases().length+`<small> of ${p.diseases.length}</small>`,S.cls==="all"?"Viral and bacterial":S.cls[0].toUpperCase()+S.cls.slice(1)],
    [`Reported cases, ${S.year}`,num(groupTotal(S.year)),
      `${p.geography} group total${excluded&&excluded!=="none"?`, excludes ${esc(excluded)}`:""}`],
    ["Datasets ingested",num(p.sources.used)+`<small> of ${p.sources.datasets}</small>`,`${num(p.sources.rows)} source rows`],
    ["Quality checks passed",`${Math.round((ch.PASS||0)/total*100)}%`,`${num(ch.PASS||0)} pass · ${num(ch.WARN||0)} warn · ${num(ch.SKIP||0)} skipped`,(ch.WARN||0)?"up":""]])
  +(biggest?`<p class="warnline">Largest change vs ${p.reference_year}: <b>${esc(biggest.label)}</b> ${pct(biggest.ref)}.</p>`:"")}};

PANEL.disease_table={t:"Every disease in this report",ic:"list",span:"full",
  sub(){const p=payload();return `Latest published year per disease, ${p.geography}. Incidence is per 100,000 residents; coverage says whether that year is complete.`},
  html(){const p=payload(),rows=changeRows();
    if(!rows.length)return`<p class="empty">No diseases in this class.</p>`;
    return table([["Disease"],["Class"],["Year",1],["Cases",1],["Per 100,000",1],["Coverage"],[`vs ${p.reference_year}`,1],["vs previous",1]],
      rows.map(r=>{const ser=seriesFor(r.topic),last=ser.length?ser[ser.length-1]:null;
        return`<tr><td>${esc(r.label)}</td><td>${esc(r.pathogen_class)}</td>`
          +`<td class="num">${last?last.year:"—"}</td>`
          +`<td class="num">${last?num(last.value):"—"}</td>`
          +`<td class="num">${last&&last.incidence!=null?dec(last.incidence,1):"—"}</td>`
          +`<td>${last?esc(last.coverage):"—"}</td>`
          +`<td class="num ${r.ref>0?"up":r.ref<0?"down":""}">${pct(r.ref)}</td>`
          +`<td class="num ${r.per>0?"up":r.per<0?"down":""}">${pct(r.per)}</td></tr>`}))}};

PANEL.priority_table={t:"Largest changes first",ic:"alertc",span:"full",
  sub(){const p=payload();return `Every disease ranked by how far it moved against ${p.reference_year}. Ranking only: the size of a change is not itself a judgement that action is needed.`},
  html(){const p=payload();
    const rows=changeRows().filter(r=>r.ref!=null)
      .sort((a,b)=>Math.abs(b.ref)-Math.abs(a.ref));
    if(!rows.length)return`<p class="empty">No change metrics for this class.</p>`;
    const widest=Math.max(...rows.map(r=>Math.abs(r.ref)));
    return table([["#",1],["Disease"],["Class"],["Cases",1],[`vs ${p.reference_year}`,1],["vs previous",1],["Size of change"]],
      rows.map((r,i)=>{const ser=seriesFor(r.topic),last=ser.length?ser[ser.length-1]:null;
        const w=Math.abs(r.ref)/widest*100;
        return`<tr><td class="num">${i+1}</td><td>${esc(r.label)}</td><td>${esc(r.pathogen_class)}</td>`
          +`<td class="num">${last?num(last.value):"—"}</td>`
          +`<td class="num ${r.ref>0?"up":"down"}">${pct(r.ref)}</td>`
          +`<td class="num ${r.per>0?"up":r.per<0?"down":""}">${pct(r.per)}</td>`
          +`<td><span class="t" style="display:block;height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden">`
          +`<span style="display:block;height:100%;width:${w.toFixed(1)}%;border-radius:4px;background:${r.ref>0?"var(--crit)":"var(--ok)"}"></span></span></td></tr>`}))
      +`<p class="warnline">Red bars rose against the reference year, green fell. Small counts can move a long way on a handful of cases.</p>`}};

PANEL.sensitivity={t:"How robust is the comparison?",ic:"shield",span:"wide",
  sub(){const p=payload();return `The same group change against ${p.reference_year}, recomputed without ${p.parameters["Sensitivity exclusion"]}. A large gap means one disease is carrying the result.`},
  html(){const p=payload(),excl=p.parameters["Sensitivity exclusion"];
    if(!excl||excl==="none")return`<p class="empty">This audience applies no sensitivity exclusion.</p>`;
    const ref=new Map(p.metrics.reference_change.map(m=>[m.subject,m.value]));
    const classes=(S.cls==="all"?["viral","bacterial"]:[S.cls]).filter(c=>ref.has(c+":main"));
    if(!classes.length)return`<p class="empty">No group metrics for this class.</p>`;
    return table([["Pathogen class"],["All diseases",1],[`Excluding ${excl}`,1],["Difference",1]],
      classes.map(c=>{const a=ref.get(c+":main"),b=ref.get(c+":sensitivity"),d=(a!=null&&b!=null)?b-a:null;
        return`<tr><td>${esc(c)}</td>`
          +`<td class="num ${a>0?"up":a<0?"down":""}">${pct(a)}</td>`
          +`<td class="num ${b>0?"up":b<0?"down":""}">${pct(b)}</td>`
          +`<td class="num">${d==null?"—":(d>=0?"+":"−")+Math.abs(d).toFixed(0)+" pts"}</td></tr>`}))
      +`<p class="warnline">Excluding ${esc(excl)} is the robustness check the report applies; it is not an alternative headline figure.</p>`}};

PANEL.group_index={t:"Index against the reference year",ic:"trend",span:"wide",
  sub(){const p=payload();return`Group total each year as a percentage of ${p.reference_year}, so classes with very different case counts can be compared.`},
  html(){const p=payload(),ser=groupSeries("group_index");
    return lineChart({labels:p.years.map(String),every:1,series:ser.map(s=>({values:s.values,color:s.color})),lines:[{y:100,color:"var(--crit)",label:p.reference_year+" = 100"}],aria:"Index against the reference year"})
      +legend(ser.map(s=>[s.label,s.color]).concat([[p.reference_year+" = 100","",1]]))}};

PANEL.small_multiples={t:"Each disease over time",ic:"chart",span:"full",
  sub(){return"Notified cases per year. Each panel has its own scale, because levels differ by orders of magnitude."},
  html(){const p=payload(),ds=diseases();if(!ds.length)return`<p class="empty">No diseases in this class.</p>`;
    return`<div class="smalls">${ds.map((d,i)=>{const rows=seriesFor(d.topic),vals=p.years.map(y=>{const r=rows.find(x=>x.year===y);return r?r.value:null}),last=[...vals].reverse().find(v=>v!=null);
      return`<div><p class="small-t">${esc(d.label)}</p><p class="small-s">${num(last)} in ${p.years.at(-1)}</p>${miniLine(vals,p.years.map(String),COLS[i%COLS.length])}</div>`}).join("")}</div>
      <p class="warnline">Years with no published value are left out of the line rather than drawn as zero.</p>`}};

PANEL.change_table={t:"Change per disease",ic:"list",span:"wide",
  sub(){const p=payload();return`Latest year against ${p.reference_year} (reference change) and against the previous year (period change).`},
  html(){const p=payload(),rows=changeRows();
    return table([["Disease"],["Class"],[`vs ${p.reference_year}`,1],["vs previous year",1]],
      rows.map(r=>`<tr><td>${esc(r.label)}</td><td>${esc(r.pathogen_class)}</td>`
        +`<td class="num ${r.ref>0?"up":r.ref<0?"down":""}">${pct(r.ref)}</td>`
        +`<td class="num ${r.per>0?"up":r.per<0?"down":""}">${pct(r.per)}</td></tr>`))
      +`<p class="warnline">A dash means the metric was not computed for that disease, usually because a year has no published value.</p>`}};

PANEL.excluded={t:"Datasets left out",ic:"alertc",span:"narrow",
  sub(){const p=payload();return`${p.selection.excluded} of ${p.selection.included+p.selection.excluded} datasets, with the rule that excluded them.`},
  html(){const p=payload(),seen=new Map();
    p.selection.table.forEach(r=>{const k=r.reason||r.status;seen.set(k,(seen.get(k)||0)+1)});
    return hbars([...seen.entries()].sort((a,b)=>b[1]-a[1]).map(([k,v])=>[k,v]),{fmt:v=>num(v)})
      +`<p class="warnline">Exclusions are rules in the audience's configuration, not data errors.</p>`}};

PANEL.quality={t:"Quality checks",ic:"quality",span:"wide",
  sub(){const p=payload(),t=p.checks.totals;return`${num(Object.values(t).reduce((a,b)=>a+b,0))} checks ran before any report was built. A failure stops the build.`},
  html(){const p=payload(),f=p.checks.flagged;
    return table([["Check"],["Pass",1],["Warn",1],["Skipped",1]],
      p.checks.by_check.map(r=>`<tr><td class="mono">${esc(r.check)}</td><td class="num">${num(r.PASS)}</td>`
        +`<td class="num">${r.WARN?`<span class="pill p-warn">${num(r.WARN)}</span>`:"0"}</td><td class="num">${num(r.SKIP)}</td></tr>`),"compact")
      +(f.length?`<p class="warnline">${f.length} warning${f.length>1?"s":""}: ${f.map(r=>esc(r.check)+" ("+esc(r.dataset_id.split("__")[0])+")").join(", ")}.</p>`
        :`<p class="warnline">No warnings.</p>`)}};

PANEL.sources={t:"Sources and provenance",ic:"database",span:"narrow",
  sub(){const p=payload();return`Publisher dates from ${p.sources.published_from} to ${p.sources.published_to}.`},
  html(){const p=payload();
    return`<dl class="meta"><dt>Data snapshot</dt><dd class="mono"><span class="trunc" title="${esc(p.snapshot_id)}">${esc(p.snapshot_id)}</span></dd>
      <dt>Datasets used</dt><dd>${num(p.sources.used)} of ${num(p.sources.datasets)}</dd>
      <dt>Source rows</dt><dd>${num(p.sources.rows)}</dd>
      <dt>Geography</dt><dd>${esc(p.geography)}</dd>
      <dt>Source</dt><dd>FOPH Infectious Diseases Dashboard exports</dd></dl>
      <p class="warnline">Each dataset is archived with its SHA-256 before analysis; the report embeds the full record.</p>`}};

PANEL.parameters={t:"Report parameters",ic:"book",span:"full",
  sub(){return"The audience's configuration file decides every one of these. The report template does not change between audiences."},
  html(){const p=payload();
    return`<dl class="meta">${Object.entries(p.parameters).map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v==null?"—":v)}</dd>`).join("")}</dl>`
      +(Object.keys(p.exclusion_notes).length?`<ul class="notes">${Object.entries(p.exclusion_notes).map(([k,v])=>`<li><b>${esc(k)}</b>: ${esc(v)}</li>`).join("")}</ul>`:"")}};

/* ---------- views ---------- */
function renderHome(){const c=S.ctx,f=c.filters||{years:[],classes:[]};
  if(!S.year&&f.years.length)S.year=f.years.at(-1);
  $("#h-cls").innerHTML=`<option value="all">All diseases</option>`
    +f.classes.map(x=>`<option value="${esc(x)}">${esc(x[0].toUpperCase()+x.slice(1))}</option>`).join("");
  $("#h-cls").value=S.cls;
  $("#h-year").innerHTML=f.years.map(y=>`<option value="${y}">${y}</option>`).join("");
  if(S.year)$("#h-year").value=S.year;

  $("#who-row").innerHTML=c.audiences.map(a=>`<button class="who-pick" data-who="${esc(a.id)}"
      ${a.ready?"":"disabled"} aria-label="${esc(a.name)}: ${esc(a.question)}">
    <span class="who-ic">${icon(CLASS_ICON[a.id]||"users","ic lg")}</span>
    <b>${esc(a.name)}</b>
    <small>${a.ready?esc(a.detail.replace("_"," ")):"no data"}</small></button>`).join("");

  const m=c.summary||{};
  $("#facts").innerHTML=m.diseases?[
    [m.diseases,"diseases"],
    [m.datasets,"source datasets"],
    [`${m.year_from}–${m.year_to}`,"years covered"],
    [m.published_to||"—","last published"],
  ].map(([v,k])=>`<div><b>${esc(v)}</b><span>${esc(k)}</span></div>`).join(""):"";

  $("#f-who").innerHTML=c.audiences.map(a=>`<option value="${esc(a.id)}">${esc(a.name)}</option>`).join("")}

function renderChrome(){const a=audience(),p=payload();
  $("#f-who").value=S.who;
  $("#f-year").innerHTML=p.years.map(y=>`<option value="${y}">${y}</option>`).join("");
  $("#f-year").value=S.year;
  $("#f-cls").value=S.cls;
  $("#access").innerHTML=icon("shield")+`${esc(a.layout)} layout · ${esc(a.detail)} detail`;
  $("#dtabs").innerHTML=a.tabs.map(t=>`<button class="dtab" role="tab" data-tab="${esc(t.id)}" aria-selected="${t.id===S.tab}">${icon(t.icon)}${esc(t.name)}</button>`).join("")
    +`<button class="dtab rep" role="tab" data-tab="report" aria-selected="${S.tab==="report"}">${icon("download")}Full report</button>`}

function panelHTML(id){const d=PANEL[id];if(!d)return"";const t=typeof d.t==="function"?d.t():d.t,sub=d.sub?d.sub():"";
  if(d.bare)return`<section class="bare s-full"><p class="lbl bare-h">${esc(t)}</p>${d.html()}</section>`;
  return`<section class="panel s-${d.span||"full"}"><div class="ph"><div><h3>${d.ic?icon(d.ic):""}${esc(t)}</h3>${sub?`<p class="sub">${esc(sub)}</p>`:""}</div></div>${d.html()}</section>`}

// The API decides which panels a tab carries, and in which order.
function panelsFor(tab){return (tab.panels||[]).filter(id=>PANEL[id])}

function renderDash(){const a=audience(),p=payload(),el=$("#dash");
  if(S.tab==="report"){el.innerHTML=reportView();wireReport();return}
  const tab=a.tabs.find(t=>t.id===S.tab)||a.tabs[0];
  el.innerHTML=`<div class="viewhead"><div><p class="eyebrow">${esc(a.name)} · ${esc(tab.name)}</p>
    <h2>${esc(a.title)}</h2><p class="lede">${esc(a.question)}</p></div>
    <button class="btn" data-save>${icon("download")}Save this dashboard</button></div>
    <div class="dgrid" id="figs"></div>
    <div class="dgrid" style="margin-top:16px">${panelsFor(tab).map(panelHTML).join("")}</div>
    <div class="dgrid" id="repsecs" style="margin-top:16px"></div>`;
  drawFigures(tab.id);drawSections(tab.id)}

function reportView(){const a=audience(),p=payload(),c=S.ctx;
  const groups={};p.diseases.forEach(d=>{(groups[d.pathogen_class]=groups[d.pathogen_class]||[]).push(d)});
  const can=!!a.report;
  return`<div class="viewhead"><div><p class="eyebrow">${esc(a.name)} · Full report</p>
    <h2>Build the report for the diseases you choose</h2>
    <p class="lede">The report is rendered here with Quarto from the same tables these dashboards use. It is one self-contained HTML file with its own provenance record.</p></div></div>
  <div class="rep-grid">
    <section class="panel"><div class="cover-top"><span class="cover-ic">HTML</span>
      <div><h3>${esc(a.title)}</h3><p class="sub" style="margin:4px 0 0">${esc(a.name)} · ${esc(p.geography)} · snapshot ${esc(String(p.snapshot_id).slice(0,12))}…</p></div></div>
      ${can?`<div class="row"><button class="btn primary big" id="go" disabled>${icon("download")}Generate report</button>
        <span class="lbl" id="count">Pick at least one disease</span></div>
        <div id="status"></div>`
        :`<div class="note err">This audience's report uses the R template, which this page cannot run. Build it with <span class="mono">python run.py release</span>.</div>`}
    </section>
    <section class="panel"><h3>${icon("dna")}Diseases</h3><p class="sub">From the analysis bundle. ${p.diseases.length} available.</p>
      ${can?`<div class="row" style="margin-bottom:10px"><button class="chip" data-pick="all">Select all</button><button class="chip" data-pick="none">Clear</button></div>
      ${Object.keys(groups).sort().map(cls=>`<p class="lbl" style="margin:10px 0 6px">${esc(cls)}</p>
        <div class="chips">${groups[cls].map(d=>`<button class="chip" data-topic="${esc(d.topic)}" aria-pressed="${S.chosen.has(d.topic)}">${esc(d.label)}</button>`).join("")}</div>`).join("")}`
      :`<p class="empty">Not applicable for this audience.</p>`}
    </section>
  </div>
  <p class="lbl" style="margin:26px 0 10px">Read a report here</p>
  <div class="rep-grid">
    <section class="panel"><h3>${icon("file")}Full reports</h3><p class="sub">Every disease, built by <span class="mono">python run.py</span>.</p>
      ${c.full_reports.length?`<ul class="files">${c.full_reports.map(f=>`<li><button class="linkish" data-view="/full/${esc(f)}" data-prov="${esc(f.replace(/\.html$/,""))}">${esc(f)}</button><span class="when">full data</span></li>`).join("")}</ul>`:`<p class="empty">None yet. Run <span class="mono">python run.py</span>.</p>`}</section>
    <section class="panel"><h3>${icon("download")}Built from a selection</h3><p class="sub">Reports you generated above.</p>
      ${c.previous.length?`<ul class="files" id="built">${c.previous.map(f=>`<li><button class="linkish" data-view="${esc(f.url)}" data-prov="${esc(f.name.replace(/\.html$/,""))}">${esc(f.name)}</button><span class="when">${esc(f.built)}</span></li>`).join("")}</ul>`:`<p class="empty">None yet.</p>`}</section>
  </div>
  <div id="reader" style="margin-top:16px"></div>`}

function viewerHTML(url,name){return`<div class="viewer" id="viewbox">
  <div class="vbar"><h3>${icon("file")}${esc(name)}</h3>
    <div class="row"><button class="btn" data-taller>Taller</button>
      <a class="btn" href="${esc(url)}" target="_blank" rel="noopener">Open in a new tab</a>
      <a class="btn primary" href="${esc(url)}" download>${icon("download")}Download</a></div></div>
  <iframe src="${esc(url)}" title="${esc(name)}" loading="lazy"></iframe></div>
  <section class="panel" id="prov" style="margin-top:16px"><h3>${icon("shield")}Provenance of this report</h3>
    <p class="sub">The record the report embeds: which data, which code and which tools produced it.</p>
    <p class="empty">Loading&hellip;</p></section>`}

function provHTML(r){const i=r.input||{},e=r.environment||{},g=r.git||{},q=r.quality_checks||{},d=r.data_retrieved||{};
  const dates=(r.datasets||[]).map(x=>x.publishing_date).filter(Boolean).sort();
  const facts=[
    ["Source",r.source],
    ["Publisher dates",dates.length?`${dates[0]} to ${dates.at(-1)}`:null],
    ["Data retrieved",d.earliest?(d.earliest===d.latest?d.earliest:`${d.earliest} to ${d.latest}`):null],
    ["Retrieval basis",d.basis],
    ["Datasets ingested",(r.datasets||[]).length+(r.raw_files_skipped_as_duplicates?` (${r.raw_files_skipped_as_duplicates} duplicate raw files skipped)`:"")],
    ["Cleaned input",i.file?`${i.file}, ${num(i.bytes)} bytes, produced by ${i.produced_by}`:null],
    ["Quality checks",Object.entries(q).map(([k,v])=>`${num(v)} ${k.toLowerCase()}`).join(", ")],
    ["Raw data snapshot",(r.raw_snapshot||{}).snapshot_id?`${r.raw_snapshot.snapshot_id} (${num(r.raw_snapshot.raw_files)} files)`:null],
    ["Report generated",r.generated_at],
    ["Tools",[e.python&&"Python "+e.python,e.pandas&&"pandas "+e.pandas,e.plotly&&"plotly "+e.plotly,e.quarto&&"Quarto "+e.quarto].filter(Boolean).join(", ")],
    ["Platform",e.platform],
    ["Code version",g.commit?g.commit+(g.uncommitted_changes?" plus uncommitted changes":""):null]];
  const params=Object.entries(r.report_parameters||{});
  return`<dl class="prov">${facts.filter(f=>f[1]).map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}
    <dt>Input checksum</dt><dd class="hash">${esc(i.sha256||"—")}</dd>
    ${Object.entries(r.code||{}).map(([k,v])=>`<dt>Code, ${esc(k)}</dt><dd class="hash">${esc(v)}</dd>`).join("")}</dl>
  ${params.length?`<details class="more"><summary>Report parameters (${params.length})</summary><dl class="prov">${params.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl></details>`:""}
  <details class="more"><summary>Datasets behind this report (${(r.datasets||[]).length})</summary>
    ${table([["Topic"],["Source system"],["Published"],["Rows",1],["SHA-256"]],(r.datasets||[]).map(x=>`<tr><td>${esc(String(x.topic).replace(/_/g," "))}</td><td>${esc(String(x.source_system).replace(/_/g," "))}</td><td>${esc(x.publishing_date)}</td><td class="num">${num(x.rows)}</td><td class="mono"><span class="trunc" title="${esc(x.sha256)}">${esc(String(x.sha256).slice(0,16))}&hellip;</span></td></tr>`),"compact")}
  </details>`}

async function showReport(url,name){S.viewing={url,name};
  $("#reader").innerHTML=viewerHTML(url,name);
  $("#reader").scrollIntoView({behavior:"smooth",block:"start"});
  try{const r=await fetch("/api/provenance/"+encodeURIComponent(name));const d=await r.json();
    $("#prov").innerHTML=`<h3>${icon("shield")}Provenance of this report</h3>`
      +`<p class="sub">The record the report embeds: which data, which code and which tools produced it.</p>`
      +(r.ok?provHTML(d):`<p class="empty">No provenance record found for this report.</p>`)}
  catch(e){const el=$("#prov");if(el)el.innerHTML=`<h3>${icon("shield")}Provenance</h3><p class="empty">Could not load the record.</p>`}}

function wireReport(){const go=$("#go");if(!go)return;
  const refresh=()=>{const n=S.chosen.size;$("#count").textContent=n?`${n} disease${n>1?"s":""} selected`:"Pick at least one disease";go.disabled=!n};
  refresh();
  go.addEventListener("click",async()=>{
    const topics=[...S.chosen],started=Date.now();go.disabled=true;
    const tick=setInterval(()=>{$("#status").innerHTML=`<div class="note"><span class="spin"></span>Rendering ${topics.length} disease(s) — ${Math.round((Date.now()-started)/1000)}s. This takes a minute or two.</div>`},1000);
    $("#status").innerHTML=`<div class="note"><span class="spin"></span>Starting the render…</div>`;
    try{const r=await fetch("/api/render",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({audience:S.who,topics})});
      const d=await r.json();clearInterval(tick);
      if(!r.ok){$("#status").innerHTML=`<div class="note err"><b>Could not build it.</b> ${esc(d.error)}</div>`}
      else{const how=d.reused?`<b>Already built.</b> This exact selection was rendered before, so it opened instantly.`:`<b>Report ready</b> in ${d.seconds}s.`;
        $("#status").innerHTML=`<div class="note ok">${how} <a href="${esc(d.url)}" target="_blank" rel="noopener">Open it</a>, or read it below.</div>`;
        showReport(d.url,d.name.replace(/\.html$/,""));
        S.ctx.previous=d.previous||S.ctx.previous}}
    catch(e){clearInterval(tick);$("#status").innerHTML=`<div class="note err">The server did not respond: ${esc(e.message||e)}</div>`}
    go.disabled=false;refresh()})}

/* save the current dashboard as one self-contained file, no libraries */
function saveDashboard(){const a=audience(),css=$("#app-css").textContent,grid=$("#dash .dgrid");
  if(!grid)return;
  const doc=`<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">`
    +`<title>${esc(a.title)}</title><style>${css}</style></head><body class="xl"><div class="wrap">`
    +`<header class="top"><div><p class="eyebrow">${esc(a.name)} · ${esc(S.tab)}</p><h1>${esc(a.title)}</h1>`
    +`<p class="tagline">${esc(payload().geography)} · snapshot ${esc(payload().snapshot_id)} · saved ${new Date().toISOString().slice(0,10)}</p></div></header>`
    +`<div class="dgrid">${grid.innerHTML}</div>`
    +`<p class="warnline">Officially notified FOPH cases, not all infections. Generated by Infection Data Explorer from a local build.</p>`
    +`</div></body></html>`;
  const name=`${S.who}-${S.tab}-${new Date().toISOString().slice(0,10)}.html`;
  const url=URL.createObjectURL(new Blob([doc],{type:"text/html"})),link=document.createElement("a");
  link.href=url;link.download=name;document.body.appendChild(link);link.click();link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000)}

/* ---------- the report's own charts ---------- */
let plotlyReady=null;
function loadPlotly(){if(window.Plotly)return Promise.resolve();
  return plotlyReady||(plotlyReady=new Promise((res,rej)=>{const sc=document.createElement("script");
    sc.src="/static/plotly.js";sc.onload=res;sc.onerror=()=>{plotlyReady=null;rej(new Error("the chart library did not load"))};
    document.head.appendChild(sc)}))}

async function figuresFor(who){if(S.figs[who])return S.figs[who];
  const r=await fetch("/api/figures/"+encodeURIComponent(who));const d=await r.json();
  if(!r.ok)throw new Error(d.error||"charts could not be built");
  S.figs[who]=d.figures;return d.figures}

async function drawFigures(tab){const host=$("#figs");if(!host)return;
  host.innerHTML=`<div class="figloading"><span class="spin"></span>Drawing the report's charts… the first time takes a few seconds.</div>`;
  let figs;
  try{[figs]=await Promise.all([figuresFor(S.who),loadPlotly()])}
  catch(e){host.innerHTML=`<div class="note err">${esc(e.message)}</div>`;return}
  const mine=figs.filter(f=>f.tab===tab);
  if(!mine.length){host.innerHTML="";return}
  host.innerHTML=mine.map(f=>`<section class="figpanel s-${f.id==="map"||f.id==="annual"||f.id==="ages"?"full":"half"}">
    <h3>${icon("chart")}${esc(f.title)}</h3><p class="sub">${esc(f.note)}</p>
    <div class="figbox" id="fig-${esc(f.id)}"></div></section>`).join("");
  const dark=matchMedia("(prefers-color-scheme: dark)").matches;
  mine.forEach(f=>{const el=document.getElementById("fig-"+f.id);if(!el)return;
    const layout=Object.assign({},f.spec.layout,{autosize:true,
      paper_bgcolor:"rgba(0,0,0,0)",plot_bgcolor:"rgba(0,0,0,0)",
      font:Object.assign({},f.spec.layout&&f.spec.layout.font,{color:dark?"#E4ECEA":"#132120"})});
    window.Plotly.newPlot(el,f.spec.data,layout,{displaylogo:false,responsive:true,
      modeBarButtonsToRemove:["lasso2d","select2d"]})})}

async function sectionsFor(who){if(S.secs[who])return S.secs[who];
  const r=await fetch("/api/sections/"+encodeURIComponent(who));const d=await r.json();
  S.secs[who]=r.ok?(d.sections||[]):[];return S.secs[who]}

async function drawSections(tab){const host=$("#repsecs");if(!host)return;
  let secs=[];
  try{secs=await sectionsFor(S.who)}catch(e){host.innerHTML="";return}
  const mine=secs.filter(x=>x.tab===tab);
  // Taken from the rendered report, so this is the report's own table or prose, verbatim.
  host.innerHTML=mine.map(x=>`<section class="repsec s-full"><h3>${icon("file")}${esc(x.title)}
    <span class="pill p-acc" style="margin-left:auto;font-weight:400">from the report</span></h3>
    <div class="body">${x.html}</div></section>`).join("")}

/* ---------- loading and routing ---------- */
async function load(audienceId){if(S.data[audienceId])return;
  const r=await fetch("/api/overview/"+encodeURIComponent(audienceId));
  const d=await r.json();
  if(!r.ok)throw new Error(d.error||"could not load this audience");
  S.data[audienceId]=d}
function setHash(){try{history.replaceState(null,"",S.who?`#${S.who}-${S.tab}`:location.pathname)}catch(e){}}
async function go(who,tab){
  if(!who){S.who=null;render();setHash();return}
  try{await load(who)}catch(e){$("#dash").innerHTML=`<div class="note err">${esc(e.message)}</div>`;$("#home").hidden=true;$("#app").hidden=false;return}
  S.who=who;const a=audience();
  S.tab=tab&&(tab==="report"||a.tabs.some(t=>t.id===tab))?tab:a.tabs[0].id;
  const p=payload();if(!S.year||!p.years.includes(S.year))S.year=p.years.at(-1);
  S.chosen=new Set(p.diseases.map(d=>d.topic));
  render();setHash();window.scrollTo({top:0})}
function render(){const home=!S.who;$("#home").hidden=!home;$("#app").hidden=home;$("#switch").hidden=home;
  if(home){renderHome();return}
  renderChrome();renderDash()}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-who],[data-home],[data-tab],[data-topic],[data-pick],[data-save],[data-view],[data-taller]");if(!t)return;
  const d=t.dataset;
  if(d.who!==undefined&&d.who)go(d.who);
  else if("home" in d)go(null);
  else if(d.tab){S.tab=d.tab;setHash();renderChrome();renderDash()}
  else if(d.topic){S.chosen.has(d.topic)?S.chosen.delete(d.topic):S.chosen.add(d.topic);renderDash()}
  else if(d.pick){S.chosen=d.pick==="all"?new Set(payload().diseases.map(x=>x.topic)):new Set();renderDash()}
  else if(d.view)showReport(d.view,d.prov||d.view.split("/").pop());
  else if("taller" in d){const b=$("#viewbox");if(b){b.classList.toggle("tall");t.textContent=b.classList.contains("tall")?"Shorter":"Taller"}}
  else if("save" in d)saveDashboard()});
$("#f-who").addEventListener("change",e=>go(e.target.value,S.tab));
$("#f-cls").addEventListener("change",e=>{S.cls=e.target.value;renderDash()});
$("#h-cls").addEventListener("change",e=>{S.cls=e.target.value});
$("#h-year").addEventListener("change",e=>{S.year=+e.target.value});
$("#f-year").addEventListener("change",e=>{S.year=+e.target.value;renderDash()});
window.addEventListener("hashchange",()=>{const[w,t]=(location.hash||"").slice(1).split("-");
  if(w&&S.ctx.audiences.some(a=>a.id===w))go(w,t)});

(async function start(){
  try{const r=await fetch("/api/context");S.ctx=await r.json()}
  catch(e){document.querySelector("main").innerHTML=`<div class="note err">Could not reach the local server. Start it with <span class="mono">python run.py web</span>.</div>`;return}
  const ready=(S.ctx&&S.ctx.audiences||[]).filter(a=>a.ready);
  if(!ready.length){document.querySelector("main").innerHTML=`<div class="note err">No analysis tables yet. Run <span class="mono">python run.py</span> once, then reload.</div>`;return}
  const[w,t]=(location.hash||"").slice(1).split("-");
  if(w&&S.ctx.audiences.some(a=>a.id===w))await go(w,t);else render()})();
</script>
</body>
</html>
